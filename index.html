<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QuestStudio</title>
<style>
:root{
  --bg:#f6f7f9;
  --surface:#ffffff;
  --surface-2:#fafbfc;
  --text:#171a1f;
  --muted:#6b7280;
  --line:#e6e8ec;
  --line-strong:#d7dae0;
  --primary:#4f46e5;
  --primary-soft:#eef2ff;
  --good:#16794f;
  --good-soft:#ecfdf3;
  --bad:#b42318;
  --bad-soft:#fef3f2;
  --shadow:0 8px 24px rgba(15,23,42,.045);
  --radius:12px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);font-size:14px}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.app{min-height:100vh}
header{height:70px;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:0 28px;position:sticky;top:0;z-index:30}
.brand{font-size:19px;font-weight:800;letter-spacing:-.03em;cursor:pointer;white-space:nowrap}
.search{position:relative;width:min(390px,34vw)}
.search input{width:100%;height:40px;padding:0 13px;border:1px solid var(--line);border-radius:9px;outline:none;background:var(--surface-2);transition:.15s}
.search input:focus{border-color:#b7bdf7;background:#fff;box-shadow:0 0 0 3px rgba(79,70,229,.08)}
.results{position:absolute;top:46px;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 35px rgba(15,23,42,.10);overflow:hidden;max-height:430px;overflow-y:auto}
.result{padding:12px 13px;border-bottom:1px solid #f0f1f3;cursor:pointer}
.result:last-child{border-bottom:0}
.result:hover{background:#f8f9fc}
.result small{color:var(--muted);display:block;margin-top:4px}
.metrics{display:flex;gap:8px;margin-left:auto}
.metric{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:12px;color:var(--muted)}
.metric b{font-size:14px;color:var(--text);margin-left:3px}
.prof{display:flex;align-items:center;gap:7px;height:38px;padding:0 12px;border:1px solid var(--line);border-radius:9px;background:#fff;color:#4b5563}
.prof:hover{border-color:var(--line-strong);background:#fafafa}
.prof.active{background:var(--primary-soft);color:var(--primary);border-color:#cdd3ff}
nav{background:#fff;border-bottom:1px solid var(--line);display:flex;padding:0 28px;gap:2px;position:sticky;top:70px;z-index:20}
.tab{height:48px;padding:0 14px;border:0;background:none;color:var(--muted);border-bottom:2px solid transparent}
.tab:hover{color:var(--text)}
.tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:700}
main{padding:24px 28px;max-width:1480px;margin:auto}
.layout{display:grid;grid-template-columns:275px minmax(0,1fr);gap:20px}
.panel,.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.side{padding:15px;max-height:calc(100vh - 160px);overflow:auto}
.layout .side{background:#171a1f;border-color:#242932;color:#f3f4f6}
.layout .side h3{color:#fff}
.layout .side .folder{background:#1d2128;border-color:#2b313a}
.layout .side .folder-head:hover{background:#232832}
.layout .side .folder-head b{color:#f3f4f6}
.layout .side .folder-head span,.layout .side .subject span:last-child{color:#9ca3af}
.layout .side .subject{color:#c5cad3}
.layout .side .subject:hover{color:#a5b4fc}
.layout .side .reset{color:#fca5a5}
.layout .side::-webkit-scrollbar{width:7px}
.layout .side::-webkit-scrollbar-track{background:transparent}
.layout .side::-webkit-scrollbar-thumb{background:#3b424d;border-radius:10px}
.layout .side::-webkit-scrollbar-thumb:hover{background:#4b5563}
.side h3,.section-title{margin:1px 0 13px;font-size:14px}
.folder{border:1px solid var(--line);border-radius:9px;margin-bottom:8px;overflow:hidden;background:#fff}
.folder-head{padding:10px 11px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.folder-head:hover{background:#fafbfc}
.folder-head b{font-weight:700}
.folder-head span,.subject span:last-child{color:var(--muted);font-size:12px}
.folder-body{padding:1px 11px 10px}
.subject{padding:7px 0;color:#4b5563;cursor:pointer;display:flex;justify-content:space-between}
.subject:hover{color:var(--primary)}
.reset{font-size:11px;border:0;background:transparent;color:#b42318;padding:5px 0;margin-top:3px}
.view{min-width:0}
.question{padding:21px 22px;margin-bottom:12px}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tag{background:#f3f4f6;color:#596273;padding:4px 7px;border-radius:6px;font-size:11px}
.statement{font-size:16px;line-height:1.7;white-space:pre-wrap;margin:11px 0 15px;letter-spacing:-.005em}
.options{display:grid;gap:7px}
.option{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:9px;padding:11px;text-align:left;background:#fff;transition:.12s}
.option:hover{border-color:#b9bdf0;background:#fcfcff}
.option input{margin-top:3px;accent-color:var(--primary)}
.answer{margin-top:13px}
.answer button,.primary{border:0;background:var(--primary);color:#fff;padding:9px 13px;border-radius:8px;font-weight:600}
.answer button:hover,.primary:hover{background:#4338ca}
.feedback{margin-top:12px;padding:11px;border-radius:8px;font-size:13px;line-height:1.5}
.good{background:var(--good-soft);color:var(--good)}
.bad{background:var(--bad-soft);color:var(--bad)}
.explanation{margin-top:9px;color:#475467;line-height:1.55}
.teacher-box{margin-top:13px;padding:14px;border:1px solid #d7dcff;background:#fafbff;border-radius:9px}
.teacher-box textarea{width:100%;min-height:115px;resize:vertical;padding:10px;border:1px solid var(--line);border-radius:8px;outline:none;margin-top:7px}
.teacher-box textarea:focus{border-color:#b7bdf7;box-shadow:0 0 0 3px rgba(79,70,229,.07)}
.empty{padding:55px 30px;text-align:center;color:var(--muted)}
.filterbar{display:flex;align-items:center;gap:8px;margin-bottom:15px;flex-wrap:wrap}
.filter-label{color:var(--muted);font-size:12px;font-weight:600;margin-right:2px}
.filter-btn{border:1px solid var(--line);background:#fff;color:#596273;padding:7px 10px;border-radius:8px;font-size:12px}
.filter-btn:hover{border-color:#cdd1d9}
.filter-btn.active{background:var(--primary-soft);border-color:#cdd3ff;color:var(--primary);font-weight:700}
.filter-spacer{flex:1}
.manage{display:grid;grid-template-columns:275px minmax(280px,1fr) minmax(360px,1.15fr);gap:14px}
.manage .panel{padding:15px;min-height:520px;height:calc(100vh - 170px);overflow:hidden}
.manage .panel:nth-child(1),
.manage .panel:nth-child(2),
.manage .panel:nth-child(3){overflow-y:auto;overflow-x:hidden}
.manage .panel::-webkit-scrollbar{width:7px}
.manage .panel::-webkit-scrollbar-track{background:transparent}
.manage .panel::-webkit-scrollbar-thumb{background:#d5d8df;border-radius:10px}
.manage .panel::-webkit-scrollbar-thumb:hover{background:#bfc3cc}
.list-item{padding:9px 10px;border-radius:8px;cursor:pointer;color:#4b5563;display:flex;align-items:center;justify-content:space-between;gap:8px}
.list-item:hover{background:#f6f7fb;color:var(--text)}
.list-item.sel{background:var(--primary-soft);color:#3730a3}
.list-item b{font-weight:800;color:var(--text)}
.list-item small{color:var(--muted)}
.toolbar{display:flex;gap:8px;margin-bottom:12px}
.toolbar textarea{flex:1;min-height:78px;padding:9px;border:1px solid var(--line);border-radius:8px;resize:vertical}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.form-grid input,.form-grid select,.form-grid textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:#fff;outline:none}
.form-grid input:focus,.form-grid select:focus,.form-grid textarea:focus{border-color:#b7bdf7;box-shadow:0 0 0 3px rgba(79,70,229,.07)}
.form-grid textarea{min-height:105px}
.full{grid-column:1/-1}
.danger,.icon-action{width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;background:#fff0f0;color:#b42318;border:1px solid #f4d2cf;border-radius:7px;padding:0;font-size:15px;line-height:1}
.icon-action.reset-action{background:#f5f7ff;color:#4f46e5;border-color:#d8dcff}
.icon-action:hover{filter:brightness(.97)}
.secondary{background:#fff;color:#4b5563;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.secondary:hover{background:#fafafa}
.topline{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px;gap:10px}
.manage-title{font-size:14px;font-weight:700}
.manage-subtitle{font-size:12px;color:var(--muted);margin:-7px 0 12px}
.section-divider{border:0;border-top:1px solid var(--line);margin:14px 0}
.action-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.action-group{display:flex;align-items:center;gap:5px;flex-shrink:0}
@media(max-width:1100px){
  header{padding:0 18px}.metrics{display:none}.search{width:40vw}
  main{padding:20px}.layout{grid-template-columns:235px 1fr}
  .manage{grid-template-columns:235px 1fr}.manage .formpanel{grid-column:1/-1}
}
@media(max-width:700px){
  header{height:auto;min-height:70px;flex-wrap:wrap;padding:10px 12px}.search{order:3;width:100%}
  nav{top:0;overflow:auto;padding:0 10px}.layout,.manage{grid-template-columns:1fr}main{padding:12px}
  .side{max-height:320px}.form-grid{grid-template-columns:1fr}.full{grid-column:auto}
  .stats{display:none}
}

.search .results{padding:6px 0}.search .result{padding:12px 14px}.search .result b{display:block;color:#1f3fbf;font-size:14px;line-height:1.35;font-weight:600}.search .result .snippet{display:block;margin-top:5px;color:#667085;font-size:12px;line-height:1.45}.search .result mark{background:#fff0a8;color:inherit;border-radius:2px;padding:0 1px}.editor-saved{display:inline-flex;align-items:center;color:#16794f;font-weight:700;font-size:13px}
</style>
</head>
<body>
<div id="app"><div style="padding:40px;font-family:Arial,sans-serif">Carregando QuestStudio...</div></div>
<script>
(function () {
  'use strict';

  var KEY = 'queststudio-v2';

  var seed = {
    books: [
      {id:'b1', name:'Caderno 1', subjects:[
        {id:'s1', name:'Lógica de Programação'},
        {id:'s2', name:'Banco de Dados'}
      ]},
      {id:'b2', name:'Caderno 2', subjects:[
        {id:'s3', name:'Engenharia de Software'},
        {id:'s4', name:'Redes'}
      ]}
    ],
    questions: [
      {id:'q1',book:'b1',subject:'s1',board:'Cesgranrio',format:'Múltipla Escolha',
       statement:'Qual estrutura de repetição é normalmente usada quando a quantidade de iterações é conhecida previamente?',
       options:['for','switch','try/catch','class'],answer:0,
       explanation:'O laço for é apropriado quando a repetição pode ser controlada por um contador ou uma condição inicial/final.'},
      {id:'q2',book:'b1',subject:'s2',board:'Cesgranrio',format:'Certo ou Errado',
       statement:'Uma chave primária identifica unicamente cada registro de uma tabela.',
       options:['Certo','Errado'],answer:0,
       explanation:'A chave primária deve identificar cada linha de forma única.'},
      {id:'q3',book:'b2',subject:'s3',board:'FCC',format:'Múltipla Escolha',
       statement:'Qual modelo de desenvolvimento organiza o projeto em etapas sequenciais?',
       options:['Cascata','Scrum','Kanban','XP'],answer:0,
       explanation:'O modelo Cascata organiza o desenvolvimento em fases sequenciais.'},
      {id:'q4',book:'b2',subject:'s4',board:'FGV',format:'Certo ou Errado',
       statement:'O protocolo HTTP é usado na camada de aplicação da arquitetura TCP/IP.',
       options:['Certo','Errado'],answer:0,
       explanation:'HTTP é um protocolo da camada de aplicação.'}
    ],
    done: [],
    review: [],
    stats: {correct:0, wrong:0},
    mode: 'study'
  };

  var db;
  try {
    db = JSON.parse(localStorage.getItem(KEY) || 'null');
  } catch (e) {
    db = null;
  }
  if (!db || !Array.isArray(db.books) || !Array.isArray(db.questions)) {
    db = seed;
  }
  if (!Array.isArray(db.done)) db.done = [];
  if (!Array.isArray(db.review)) db.review = [];
  if (!db.stats) db.stats = {correct:0,wrong:0};
  if (typeof db.stats.correct !== 'number') db.stats.correct = 0;
  if (typeof db.stats.wrong !== 'number') db.stats.wrong = 0;

  var state = {
    tab:'estudar',
    search:'',
    selectedBook:null,
    selectedSubject:null,
    manageBook:db.books.length ? db.books[0].id : null,
    manageSubject:null
  };

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(db)); } catch(e) {}
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function bookName(id) {
    for (var i=0;i<db.books.length;i++) if (db.books[i].id === id) return db.books[i].name;
    return '';
  }

  function subjectName(id) {
    for (var i=0;i<db.books.length;i++) {
      for (var j=0;j<db.books[i].subjects.length;j++) {
        if (db.books[i].subjects[j].id === id) return db.books[i].subjects[j].name;
      }
    }
    return '';
  }

  function percent() {
    var t = db.stats.correct + db.stats.wrong;
    return t ? Math.round(db.stats.correct / t * 100) : 0;
  }

  function pending() {
    return db.questions.filter(function(q) {
      return db.done.indexOf(q.id) === -1 && db.review.indexOf(q.id) === -1;
    });
  }

  function render() {
    var app = document.getElementById('app');
    if (!app) return;

    app.innerHTML =
      '<header>' +
        '<div class="brand" id="brand">QuestStudio</div>' +
        '<div class="search">' +
          '<input id="searchInput" placeholder="Pesquisar questões..." value="' + esc(state.search) + '">' +
          (state.search ? searchResults() : '') +
        '</div>' +
        '<div class="metrics">' +
          '<div class="metric">Acertos <b>' + db.stats.correct + '</b></div>' +
          '<div class="metric">Erros <b>' + db.stats.wrong + '</b></div>' +
          '<div class="metric">Desempenho <b>' + percent() + '%</b></div>' +
        '</div>' +
        '<button class="prof ' + (db.mode === 'teacher' ? 'active' : '') + '" id="teacherBtn">🎓 Modo Professor</button>' +
      '</header>' +
      '<nav>' +
        tabButton('estudar','Estudar') +
        tabButton('revisao','Revisão') +
        tabButton('feitas','Questões') +
        tabButton('gerenciar','Gerenciar Conteúdo') +
      '</nav>' +
      '<main>' + (state.tab === 'gerenciar' ? manageView() : studyView()) + '</main>';

    document.getElementById('brand').onclick = function(){ go('estudar'); };
    document.getElementById('teacherBtn').onclick = toggleTeacher;

    var input = document.getElementById('searchInput');
    input.oninput = function(){ state.search = input.value; render(); };
    input.onkeydown = function(e){ if(e.key === 'Escape'){ state.search=''; render(); } };

    bindTabs();
    bindStudyActions();
  }

  function tabButton(id,label) {
    return '<button class="tab ' + (state.tab === id ? 'active':'') + '" data-tab="' + id + '">' + label + '</button>';
  }

  function bindTabs() {
    var tabs = document.querySelectorAll('[data-tab]');
    for (var i=0;i<tabs.length;i++) {
      tabs[i].onclick = function(){ go(this.getAttribute('data-tab')); };
    }
  }

  function normalizeSearchText(value) {
    return String(value == null ? '' : value).toLocaleLowerCase('pt-BR').normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  }
  function questionSearchText(q) {
    var alternatives=Array.isArray(q.options)?q.options.join(' '):'';
    return [q.statement,alternatives,q.board,q.year,q.format,q.explanation,subjectName(q.subject),bookName(q.book)].join(' ');
  }
  function highlightSearch(text,query) {
    var clean=String(text||''),words=String(query||'').trim().split(/\s+/).filter(Boolean).slice(0,8);
    if(!words.length)return esc(clean);
    var pattern=words.map(function(w){return w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}).join('|');
    var re=new RegExp('('+pattern+')','ig');
    return clean.split(re).map(function(part,i){return i%2?'<mark>'+esc(part)+'</mark>':esc(part);}).join('');
  }
  function searchResults() {
    var query=state.search.trim();if(!query)return '';
    var normalizedQuery=normalizeSearchText(query),words=normalizedQuery.split(/\s+/).filter(Boolean);
    var arr=db.questions.map(function(q){
      var hay=normalizeSearchText(questionSearchText(q)),score=0;
      if(hay.indexOf(normalizedQuery)>=0)score+=100;
      words.forEach(function(w){if(hay.indexOf(w)>=0)score+=10;});
      var st=normalizeSearchText(q.statement),op=normalizeSearchText(Array.isArray(q.options)?q.options.join(' '):''),ba=normalizeSearchText(q.board),ye=normalizeSearchText(q.year);
      if(st.indexOf(normalizedQuery)>=0)score+=35;if(op.indexOf(normalizedQuery)>=0)score+=25;if(ba.indexOf(normalizedQuery)>=0)score+=20;if(ye.indexOf(normalizedQuery)>=0)score+=20;
      return {q:q,score:score,hay:hay};
    }).filter(function(x){return words.every(function(w){return x.hay.indexOf(w)>=0;});}).sort(function(a,b){return b.score-a.score;}).slice(0,20);
    return '<div class="results">'+(arr.length?arr.map(function(x){var q=x.q,text=q.statement||'',snippet=text.length>155?text.slice(0,155)+'…':text,meta=[q.board||'',q.year||'',subjectName(q.subject)||'',bookName(q.book)||''].filter(Boolean).join(' · ');return '<div class="result" data-jump="'+esc(q.id)+'"><b>'+highlightSearch(snippet,query)+'</b><span class="snippet">'+highlightSearch(meta,query)+'</span></div>';}).join(''):'<div class="result"><b>Nenhuma questão encontrada</b><span class="snippet">Tente outra palavra ou frase.</span></div>')+'</div>';
  }

  function studyView() {
    var arr;
    if (state.tab === 'revisao') arr = db.questions.filter(function(q){return db.review.indexOf(q.id)!==-1;});
    else if (state.tab === 'feitas') arr = db.questions.filter(function(q){return db.done.indexOf(q.id)!==-1;});
    else arr = pending();

    if (state.selectedBook) arr = arr.filter(function(q){return q.book===state.selectedBook;});
    if (state.selectedSubject) arr = arr.filter(function(q){return q.subject===state.selectedSubject;});

    return '<div class="layout">' +
      '<aside class="panel side"><h3>Cadernos</h3>' + sidebar() + '</aside>' +
      '<section class="view">' +
        questionFilter() +
        (arr.length ? arr.map(questionCard).join('') : '<div class="panel empty">Nenhuma questão nesta seção.</div>') +
      '</section>' +
    '</div>';
  }

  function questionFilter() {
    var filters = [
      ['all','Todas'],
      ['pending','Não respondidas'],
      ['review','Em revisão'],
      ['done','Feitas']
    ];
    var current = 'all';
    if(state.tab === 'revisao') current = 'review';
    else if(state.tab === 'feitas') current = 'done';
    else if(state.tab === 'estudar') current = 'pending';

    return '<div class="filterbar">' +
      '<span class="filter-label">Filtrar questões</span>' +
      filters.map(function(f){
        return '<button class="filter-btn '+(current===f[0]?'active':'')+'" data-question-filter="'+f[0]+'">'+f[1]+'</button>';
      }).join('') +
      '<span class="filter-spacer"></span>' +
      '<span class="filter-label">'+db.questions.length+' questões</span>' +
    '</div>';
  }

  function applyQuestionFilter(type) {
    if(type === 'review') state.tab='revisao';
    else if(type === 'done') state.tab='feitas';
    else if(type === 'pending') state.tab='estudar';
    else state.tab='estudar';
    state.selectedBook=null;
    state.selectedSubject=null;
    render();
  }

  function sidebar() {
    return db.books.map(function(b) {
      var qs = db.questions.filter(function(q){return q.book===b.id;});
      var solved = qs.filter(function(q){return db.done.indexOf(q.id)!==-1;}).length;
      return '<div class="folder">' +
        '<div class="folder-head" data-book="'+esc(b.id)+'"><b>'+esc(b.name)+'</b><span>'+solved+'/'+qs.length+'</span></div>' +
        '<div class="folder-body">' +
          b.subjects.map(function(s) {
            var x = qs.filter(function(q){return q.subject===s.id;});
            var d = x.filter(function(q){return db.done.indexOf(q.id)!==-1;}).length;
            return '<div class="subject" data-subject="'+esc(s.id)+'"><span>'+esc(s.name)+'</span><span>'+d+'/'+x.length+'</span></div>';
          }).join('') +
        '</div>' +
      '</div>';
    }).join('');
  }

  function questionCard(q) {
    var opts = q.options.map(function(o,i) {
      return '<label class="option"><input type="radio" name="'+esc(q.id)+'" value="'+i+'"> <span>'+esc(o)+'</span></label>';
    }).join('');

    return '<article class="card question" id="question-'+esc(q.id)+'">' +
      '<div class="meta"><span class="tag">'+esc(bookName(q.book))+'</span><span class="tag">'+esc(subjectName(q.subject))+'</span><span class="tag">'+esc(q.board)+'</span><span class="tag">'+esc(q.format)+'</span></div>' +
      '<div class="statement">'+esc(q.statement)+'</div>' +
      '<div class="options">'+opts+'</div>' +
      '<div class="answer"><button data-answer="'+esc(q.id)+'">Responder</button></div>' +
      '<div id="feedback-'+esc(q.id)+'"></div>' +
    '</article>';
  }

  function bindStudyActions() {
    var filters=document.querySelectorAll('[data-question-filter]');
    for(var fi=0;fi<filters.length;fi++) filters[fi].onclick=function(){
      applyQuestionFilter(this.getAttribute('data-question-filter'));
    };

    var jumps = document.querySelectorAll('[data-jump]');
    for (var i=0;i<jumps.length;i++) jumps[i].onclick = function(){
      var id=this.getAttribute('data-jump');
      state.search='';
      render();
      setTimeout(function(){
        var el=document.getElementById('question-'+id);
        if(el) el.scrollIntoView({behavior:'smooth',block:'center'});
      },50);
    };

    var books=document.querySelectorAll('[data-book]');
    for (var i=0;i<books.length;i++) books[i].onclick=function(){filterBook(this.getAttribute('data-book'));};

    var subs=document.querySelectorAll('[data-subject]');
    for (var i=0;i<subs.length;i++) subs[i].onclick=function(){filterSubject(this.getAttribute('data-subject'));};

    var resets=document.querySelectorAll('[data-reset]');
    for (var i=0;i<resets.length;i++) resets[i].onclick=function(e){
      e.stopPropagation(); resetBook(this.getAttribute('data-reset'));
    };

    var answers=document.querySelectorAll('[data-answer]');
    for (var i=0;i<answers.length;i++) answers[i].onclick=function(){answer(this.getAttribute('data-answer'));};

    bindManagerActions();
  }

  function answer(id) {
    var q=db.questions.filter(function(x){return x.id===id;})[0];
    var picked=document.querySelector('input[name="'+CSS.escape(id)+'"]:checked');
    var box=document.getElementById('feedback-'+id);
    if(!picked){box.innerHTML='<div class="feedback bad">Selecione uma alternativa.</div>';return;}
    var ok=Number(picked.value)===q.answer;
    if(db.mode==='teacher' && ok) {
      box.innerHTML='<div class="teacher-box"><b>Justifique sua resposta</b><p>Explique com suas próprias palavras por que a alternativa escolhida está correta.</p><textarea id="why-'+esc(id)+'" placeholder="Digite sua justificativa..."></textarea><button class="primary" id="gradeBtn-'+esc(id)+'" style="margin-top:9px">Enviar justificativa</button><div id="grade-'+esc(id)+'"></div></div>';
      document.getElementById('gradeBtn-'+id).onclick=function(){gradeJustification(id);};
      return;
    }
    finish(id,ok);
  }

  function gradeJustification(id) {
    var q=db.questions.filter(function(x){return x.id===id;})[0];
    var text=document.getElementById('why-'+id).value.trim();
    var target=document.getElementById('grade-'+id);
    if(!text){target.innerHTML='<div class="feedback bad">Escreva uma justificativa antes de enviar.</div>';return;}
    var terms=(q.explanation+' '+q.statement).toLowerCase().split(/\W+/).filter(function(x){return x.length>4;});
    var words=text.toLowerCase().split(/\W+/);
    var hits=terms.filter(function(t){return words.indexOf(t)!==-1;}).length;
    var score=Math.min(100,Math.round(45+(hits/Math.max(1,Math.min(terms.length,8)))*55));
    if(text.length>=45) score=Math.min(100,score+15);
    var ok=score>=70;
    target.innerHTML='<div class="feedback '+(ok?'good':'bad')+'">Avaliação da justificativa: '+score+'%. '+(ok?'Clareza e certeza suficientes.':'A justificativa foi enviada para a Área de Revisão.')+'</div>';
    if(ok) setTimeout(function(){finish(id,true);},700);
    else {if(db.review.indexOf(id)===-1)db.review.push(id);save();}
  }

  function finish(id,ok) {
    db.done=db.done.filter(function(x){return x!==id;});
    db.review=db.review.filter(function(x){return x!==id;});
    if(ok){db.done.push(id);db.stats.correct++;}
    else {db.review.push(id);db.stats.wrong++;}
    save(); render();
  }

  function go(t){state.tab=t;state.selectedBook=null;state.selectedSubject=null;render();}
  function filterBook(id){state.selectedBook=id;state.selectedSubject=null;render();}
  function filterSubject(id){state.selectedSubject=id;state.selectedBook=null;render();}
  function toggleTeacher(){db.mode=db.mode==='teacher'?'study':'teacher';save();render();}

  function resetBook(id) {
    if(!confirm('Resetar o progresso deste caderno?')) return;
    var ids=db.questions.filter(function(q){return q.book===id;}).map(function(q){return q.id;});
    db.done=db.done.filter(function(x){return ids.indexOf(x)===-1;});
    db.review=db.review.filter(function(x){return ids.indexOf(x)===-1;});
    save();render();
  }

  function manageView() {
    var book=db.books.filter(function(b){return b.id===state.manageBook;})[0] || db.books[0];
    if(book) state.manageBook=book.id;
    var subject=book && state.manageSubject ? book.subjects.filter(function(s){return s.id===state.manageSubject;})[0] : null;
    var qs=db.questions.filter(function(q){return book && q.book===book.id && (!subject || q.subject===subject.id);});

    return '<div class="manage">' +
      '<div class="panel">' +
        '<div class="topline"><span class="manage-title">Cadernos</span><button class="primary" id="addBookBtn">+ Caderno</button></div>' +
        '<div class="manage-subtitle">Organize suas matérias e questões.</div>' +
        db.books.map(function(b){
          return '<div class="list-item '+(book&&book.id===b.id?'sel':'')+'" data-manage-book="'+esc(b.id)+'">' +
            '<b>'+esc(b.name)+'</b><span class="action-group">' +
            '<button class="icon-action reset-action" title="Resetar caderno" data-reset-book="'+esc(b.id)+'" aria-label="Resetar caderno">↻</button>' +
            '<button class="icon-action" title="Excluir caderno" data-delete-book="'+esc(b.id)+'" aria-label="Excluir caderno">⌫</button>' +
            '</span></div>';
        }).join('') +
        '<hr class="section-divider"><h4>+All — importação estruturada</h4>' +
        '<div class="toolbar"><textarea id="allImport" placeholder="Caderno 1: matéria 1; matéria 2;"></textarea><button class="primary" id="importBtn">Importar</button></div>' +
      '</div>' +
      '<div class="panel">' +
        '<div class="topline"><span class="manage-title">Matérias e questões</span><button class="primary" id="newQuestionBtn">+ Questão</button></div>' +
        '<div class="manage-subtitle">'+(book?esc(book.name):'Nenhum caderno selecionado')+'</div>' +
        (book ? book.subjects.map(function(s){
          return '<div class="list-item '+(subject&&subject.id===s.id?'sel':'')+'" data-manage-subject="'+esc(s.id)+'">' +
            '<span>'+esc(s.name)+' <small>('+db.questions.filter(function(q){return q.subject===s.id;}).length+')</small></span>' +
            '<span class="action-group">' +
            '<button class="icon-action reset-action" title="Resetar matéria" data-reset-subject="'+esc(s.id)+'" aria-label="Resetar matéria">↻</button>' +
            '<button class="icon-action" title="Excluir matéria" data-delete-subject="'+esc(s.id)+'" aria-label="Excluir matéria">⌫</button>' +
            '</span></div>';
        }).join('') : '') +
        '<hr class="section-divider">' +
        (qs.map(function(q){
          return '<div class="list-item" data-edit="'+esc(q.id)+'"><span>'+esc(q.statement.slice(0,80))+(q.statement.length>80?'…':'')+'</span><span class="action-group"><button class="icon-action" title="Excluir questão" data-delete-question="'+esc(q.id)+'" aria-label="Excluir questão">⌫</button></span></div>';
        }).join('') || '<div class="empty">Nenhuma questão.</div>') +
      '</div>' +
      '<div class="panel formpanel" id="editor"><div class="empty">Selecione uma questão ou clique em “+ Questão”.</div></div>' +
    '</div>';
  }

  function bindManagerActions() {
    if(state.tab!=='gerenciar') return;
    var add=document.getElementById('addBookBtn'); if(add) add.onclick=addBook;
    var imp=document.getElementById('importBtn'); if(imp) imp.onclick=importAll;
    var nq=document.getElementById('newQuestionBtn'); if(nq) nq.onclick=newQuestion;

    document.querySelectorAll('[data-manage-book]').forEach(function(el){
      el.onclick=function(){state.manageBook=this.getAttribute('data-manage-book');state.manageSubject=null;render();};
    });
    document.querySelectorAll('[data-manage-subject]').forEach(function(el){
      el.onclick=function(){state.manageSubject=this.getAttribute('data-manage-subject');render();};
    });
    document.querySelectorAll('[data-edit]').forEach(function(el){
      el.onclick=function(){editQuestion(this.getAttribute('data-edit'));};
    });

    document.querySelectorAll('[data-delete-book]').forEach(function(el){
      el.onclick=function(e){e.stopPropagation();deleteBook(this.getAttribute('data-delete-book'));};
    });
    document.querySelectorAll('[data-delete-subject]').forEach(function(el){
      el.onclick=function(e){e.stopPropagation();deleteSubject(this.getAttribute('data-delete-subject'));};
    });
    document.querySelectorAll('[data-delete-question]').forEach(function(el){
      el.onclick=function(e){e.stopPropagation();deleteQuestion(this.getAttribute('data-delete-question'));};
    });
    document.querySelectorAll('[data-reset-book]').forEach(function(el){
      el.onclick=function(e){e.stopPropagation();resetBookManager(this.getAttribute('data-reset-book'));};
    });
    document.querySelectorAll('[data-reset-subject]').forEach(function(el){
      el.onclick=function(e){e.stopPropagation();resetSubjectManager(this.getAttribute('data-reset-subject'));};
    });
  }

  function resetBookManager(id){
    var b=db.books.filter(function(x){return x.id===id;})[0];
    if(!b)return;
    if(!confirm('Resetar todas as questões do caderno "'+b.name+'" para o estado inicial?'))return;
    var ids=db.questions.filter(function(q){return q.book===id;}).map(function(q){return q.id;});
    db.done=db.done.filter(function(x){return ids.indexOf(x)===-1;});
    db.review=db.review.filter(function(x){return ids.indexOf(x)===-1;});
    save();render();
  }

  function resetSubjectManager(id){
    var s=null;
    for(var i=0;i<db.books.length;i++){
      var found=db.books[i].subjects.filter(function(x){return x.id===id;})[0];
      if(found){s=found;break;}
    }
    if(!s)return;
    if(!confirm('Resetar todas as questões da matéria "'+s.name+'" para o estado inicial?'))return;
    var ids=db.questions.filter(function(q){return q.subject===id;}).map(function(q){return q.id;});
    db.done=db.done.filter(function(x){return ids.indexOf(x)===-1;});
    db.review=db.review.filter(function(x){return ids.indexOf(x)===-1;});
    save();render();
  }

  function deleteBook(id){
    var b=db.books.filter(function(x){return x.id===id;})[0];
    if(!b)return;
    if(!confirm('Excluir o caderno "'+b.name+'" e todas as suas matérias e questões?'))return;
    var ids=db.questions.filter(function(q){return q.book===id;}).map(function(q){return q.id;});
    db.questions=db.questions.filter(function(q){return q.book!==id;});
    db.done=db.done.filter(function(x){return ids.indexOf(x)===-1;});
    db.review=db.review.filter(function(x){return ids.indexOf(x)===-1;});
    db.books=db.books.filter(function(x){return x.id!==id;});
    state.manageBook=db.books.length?db.books[0].id:null;
    state.manageSubject=null;
    save();render();
  }

  function deleteSubject(id){
    var holder=null;
    for(var i=0;i<db.books.length;i++){
      if(db.books[i].subjects.some(function(s){return s.id===id;})){holder=db.books[i];break;}
    }
    if(!holder)return;
    var s=holder.subjects.filter(function(x){return x.id===id;})[0];
    if(!s)return;
    if(!confirm('Excluir a matéria "'+s.name+'" e todas as questões dela?'))return;
    var ids=db.questions.filter(function(q){return q.subject===id;}).map(function(q){return q.id;});
    db.questions=db.questions.filter(function(q){return q.subject!==id;});
    db.done=db.done.filter(function(x){return ids.indexOf(x)===-1;});
    db.review=db.review.filter(function(x){return ids.indexOf(x)===-1;});
    holder.subjects=holder.subjects.filter(function(x){return x.id!==id;});
    state.manageSubject=null;
    save();render();
  }

  function addBook(){
    var n=prompt('Nome do caderno:');
    if(!n) return;
    var b={id:'b'+Date.now(),name:n.trim(),subjects:[]};
    b.subjects.push({id:'s'+Date.now(),name:'Nova matéria'});
    db.books.push(b);state.manageBook=b.id;state.manageSubject=null;save();render();
  }

  function importAll(){
    var el=document.getElementById('allImport'); if(!el)return;
    el.value.split(/\n/).map(function(x){return x.trim();}).filter(Boolean).forEach(function(line){
      var m=line.match(/^([^:]+):\s*(.+)$/); if(!m)return;
      var name=m[1].trim(), b=db.books.filter(function(x){return x.name.toLowerCase()===name.toLowerCase();})[0];
      if(!b){b={id:'b'+Date.now()+Math.random(),name:name,subjects:[]};db.books.push(b);}
      m[2].split(';').map(function(x){return x.trim();}).filter(Boolean).forEach(function(n){
        if(!b.subjects.some(function(s){return s.name.toLowerCase()===n.toLowerCase();})) b.subjects.push({id:'s'+Date.now()+Math.random(),name:n});
      });
    });
    save();render();
  }

  function newQuestion(){
    var b=db.books.filter(function(x){return x.id===state.manageBook;})[0]||db.books[0];
    if(!b){alert('Crie um caderno primeiro.');return;}
    if(!b.subjects.length)b.subjects.push({id:'s'+Date.now(),name:'Nova matéria'});
    editor({id:'',book:b.id,subject:b.subjects[0].id,board:'',format:'Múltipla Escolha',statement:'',options:['','','',''],answer:0,explanation:''});
  }

  function editQuestion(id){
    var q=db.questions.filter(function(x){return x.id===id;})[0];
    if(q) editor(q);
  }

  function editor(q){
    var panel=document.getElementById('editor');if(!panel)return;
    var b=db.books.filter(function(x){return x.id===q.book;})[0]||db.books[0],isCE=q.format==='Certo ou Errado';
    var opts=isCE?(q.options&&q.options.length>=2?[q.options[0]||'Certo',q.options[1]||'Errado']:['Certo','Errado']):(q.options&&q.options.length?q.options:['','','','']);
    panel.innerHTML='<h3>'+(q.id?'Editar':'Nova')+' questão</h3><div class="form-grid">'+
      '<select id="fbook">'+db.books.map(function(x){return '<option value="'+esc(x.id)+'" '+(x.id===b.id?'selected':'')+'>'+esc(x.name)+'</option>';}).join('')+'</select>'+
      '<select id="fsubject">'+(b.subjects||[]).map(function(s){return '<option value="'+esc(s.id)+'" '+(s.id===q.subject?'selected':'')+'>'+esc(s.name)+'</option>';}).join('')+'</select>'+
      '<input id="fboard" placeholder="Banca" value="'+esc(q.board||'')+'"><input id="fyear" placeholder="Ano" value="'+esc(q.year||'')+'">'+
      '<select id="fformat"><option '+(q.format==='Múltipla Escolha'?'selected':'')+'>Múltipla Escolha</option><option '+(isCE?'selected':'')+'>Certo ou Errado</option></select>'+
      '<textarea class="full" id="fstatement" placeholder="Enunciado — use Enter para quebra de linha">'+esc(q.statement||'')+'</textarea>'+
      '<div class="full" id="optionsBox">'+renderOptionInputs(opts,isCE)+'</div>'+
      '<select id="fanswer">'+(isCE?'<option value="0" '+(q.answer===0?'selected':'')+'>Gabarito: Certo</option><option value="1" '+(q.answer===1?'selected':'')+'>Gabarito: Errado</option>':opts.map(function(o,i){return '<option value="'+i+'" '+(i===q.answer?'selected':'')+'>Gabarito: alternativa '+(i+1)+'</option>';}).join(''))+'</select>'+
      '<textarea class="full" id="fexp" placeholder="Explicação manual da resposta">'+esc(q.explanation||'')+'</textarea>'+
      '</div><div style="display:flex;align-items:center;gap:10px;margin-top:12px"><button class="primary" id="saveQ">Salvar</button><span id="savedMsg"></span></div>';
    document.getElementById('fbook').onchange=function(){var nb=db.books.filter(function(x){return x.id===this.value;},this)[0];document.getElementById('fsubject').innerHTML=(nb.subjects||[]).map(function(s){return '<option value="'+esc(s.id)+'">'+esc(s.name)+'</option>';}).join('');};
    document.getElementById('fformat').onchange=function(){var ce=this.value==='Certo ou Errado',current=[];for(var i=0;i<4;i++){var el=document.getElementById('fo'+i);if(el)current.push(el.value);}var vals=ce?['Certo','Errado']:(current.length>=4?current:['','','','']);document.getElementById('optionsBox').innerHTML=renderOptionInputs(vals,ce);document.getElementById('fanswer').innerHTML=ce?'<option value="0">Gabarito: Certo</option><option value="1">Gabarito: Errado</option>':vals.map(function(o,i){return '<option value="'+i+'">Gabarito: alternativa '+(i+1)+'</option>';}).join('');};
    document.getElementById('saveQ').onclick=function(){saveQuestion(q.id||'');};
  }
  function renderOptionInputs(opts,isCE){return opts.map(function(o,i){return '<input id="fo'+i+'" placeholder="'+(isCE?(i===0?'Certo':'Errado'):'Alternativa '+(i+1))+'" value="'+esc(o)+'">';}).join('');}

  function saveQuestion(id){
    var format=document.getElementById('fformat').value,isCE=format==='Certo ou Errado';
    var options=isCE?[document.getElementById('fo0').value||'Certo',document.getElementById('fo1').value||'Errado']:[0,1,2,3].map(function(i){var el=document.getElementById('fo'+i);return el?el.value:'';});
    var q={id:id||'q'+Date.now(),book:document.getElementById('fbook').value,subject:document.getElementById('fsubject').value,board:document.getElementById('fboard').value.trim(),year:document.getElementById('fyear').value.trim(),format:format,statement:document.getElementById('fstatement').value,options:options,answer:Number(document.getElementById('fanswer').value),explanation:document.getElementById('fexp').value};
    var idx=db.questions.findIndex(function(x){return x.id===q.id;});if(idx>=0)db.questions[idx]=q;else db.questions.push(q);state.manageBook=q.book;state.manageSubject=q.subject;save();
    render();setTimeout(function(){editQuestion(q.id);var m=document.getElementById('savedMsg');if(m){m.className='editor-saved';m.textContent='Salvo';}},0);
  }

  function deleteQuestion(id){
    db.questions=db.questions.filter(function(q){return q.id!==id;});
    db.done=db.done.filter(function(x){return x!==id;});
    db.review=db.review.filter(function(x){return x!==id;});
    save();render();
  }

  // Primeira execução: renderização direta e sem dependências externas.
  render();
})();
</script>
</body>
</html>
